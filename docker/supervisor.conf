[supervisord]
nodaemon=true

[program:hantaro-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/hantaro/artisan queue:work --sleep=3 --tries=3 --timeout=120
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/hantaro/storage/logs/worker.log
stopwaitsecs=3600

[program:hantaro-scheduler]
command=php /var/www/hantaro/artisan schedule:work
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/hantaro/storage/logs/scheduler.log
